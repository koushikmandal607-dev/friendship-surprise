<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise for Cutie Priyanka! ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Short+Stack&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #fff9ed;
      /* Cute paper dot pattern */
      background-image: radial-gradient(#ffd5a1 2px, transparent 2px);
      background-size: 24px 24px;
      font-family: 'Short Stack', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Floating Doodle Elements */
    .doodle {
      position: absolute;
      font-size: 32px;
      user-select: none;
      animation: float 4s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(-5deg); }
      100% { transform: translateY(-15px) rotate(8deg); }
    }

    /* Doodle positions */
    .d1 { top: 10%; left: 10%; animation-delay: 0s; }
    .d2 { top: 15%; right: 12%; animation-delay: 0.5s; }
    .d3 { bottom: 15%; left: 8%; animation-delay: 1s; }
    .d4 { bottom: 10%; right: 10%; animation-delay: 1.5s; }
    .d5 { top: 50%; left: 4%; animation-delay: 0.8s; }
    .d6 { top: 45%; right: 5%; animation-delay: 1.2s; }

    /* Doodle Card Container */
    .doodle-card {
      background: #ffffff;
      border: 4px solid #333;
      border-radius: 25px;
      padding: 30px 25px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 8px 8px 0px #333;
      position: relative;
      z-index: 10;
    }

    .title {
      font-family: 'Fredoka One', cursive;
      color: #ff5e7e;
      font-size: 26px;
      margin-bottom: 5px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0px #333;
    }

    .subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 25px;
    }

    /* Doodle Envelope Box */
    .envelope-box {
      background: #ffe3e8;
      border: 3px dashed #ff5e7e;
      border-radius: 20px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .envelope-box:hover {
      transform: scale(1.03) rotate(-1deg);
    }

    .envelope-icon {
      font-size: 60px;
      display: block;
      margin-bottom: 10px;
      animation: bounce 1.8s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .tap-text {
      font-family: 'Fredoka One', cursive;
      color: #ff5e7e;
      font-size: 18px;
    }

    /* Hidden Secret Message */
    .secret-message {
      display: none;
      margin-top: 20px;
      background: #fff0f3;
      border: 3px solid #333;
      border-radius: 15px;
      padding: 15px;
      animation: popIn 0.4s ease-out forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .secret-message h2 {
      font-family: 'Fredoka One', cursive;
      color: #ff5e7e;
      margin: 0 0 10px 0;
      font-size: 22px;
    }

    .secret-message p {
      color: #333;
      font-size: 15px;
      line-height: 1.4;
      margin: 5px 0;
    }

    .signature {
      font-family: 'Fredoka One', cursive;
      color: #333;
      margin-top: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Floating Sticker Doodles -->
  <div class="doodle d1">☀️</div>
  <div class="doodle d2">⭐</div>
  <div class="doodle d3">🐱</div>
  <div class="doodle d4">🎨</div>
  <div class="doodle d5">🎈</div>
  <div class="doodle d6">💖</div>

  <!-- Main Doodle Card -->
  <div class="doodle-card">
    <div class="title">HAPPY FRIENDSHIP DAY!</div>
    <div class="subtitle">For Cutie Priyanka ✨</div>

    <div class="envelope-box" id="envBox" onclick="revealMessage()">
      <span class="envelope-icon" id="envIcon">💌</span>
      <div class="tap-text" id="tapText">TAP TO UNLOCK 🎁</div>
    </div>

    <div class="secret-message" id="secretMsg">
      <h2>Surprise! 🎉💛</h2>
      <p>Hey Cutie!</p>
      <p>You bring so much joy, smiles, and good vibes into my life. Thanks for being the best friend ever!</p>
      <div class="signature">— Koushik ✨</div>
    </div>
  </div>

  <script>
    function revealMessage() {
      document.getElementById('secretMsg').style.display = 'block';
      document.getElementById('envIcon').innerText = '💖';
      document.getElementById('tapText').innerText = 'YOU ARE AWESOME!';
    }
  </script>

</body>
</html>
